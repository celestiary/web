<!DOCTYPE html>
<!-- chrome-hidden: the nav and HUD start hidden, and fade in with the
     load's reveal (js/Celestiary.js _setNav), or not, for a link with 'v'
     off: never shown and then hidden. -->
<html class="chrome-hidden">
  <head>
    <meta charset="utf-8"/>
    <!-- The first paint is in the user's own theme (Canvas: light or dark,
         as their system is), then the page dims to the scene's black
         (page-up, below): no white flash for a dark theme, no hard cut to
         black for a light one.  First in <head>, before any stylesheet or
         script, so the first paint has it. -->
    <meta name="color-scheme" content="light dark"/>
    <style>
      html, body {
        background: Canvas;
        color: CanvasText;
        transition: background-color 500ms ease-in-out, color 500ms ease-in-out;
      }
      html.page-up, html.page-up body {
        background: #000;
        color: #fff;
        /* The app's controls (scrollbars, inputs) are dark from here on. */
        color-scheme: dark;
      }
    </style>
    <base href="/web/pr-preview/pr-309/"/>
    <title>Celestiary - Celestial Simulator</title>
    <meta name="description" content="Fly the real sky: the solar system, a million Gaia stars and the galaxies around us, physically lit, at any time and place, in your browser."/>
    <!-- The canonical address (and, in a PR preview, noindex), from
         esbuild/site.js at build time. -->
    <link rel="canonical" href="https://celestiary.org/"/>
    <meta property="og:url" content="https://celestiary.org/"/>
    <meta name="robots" content="noindex"/>
    <meta name="keywords"
          content="javascript webgl astronomy glsl virtual-reality three-js webgl2 glsl-shaders 3d astrophysical-simulation"/>
    <meta name="theme-color" content="#000000"/>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DBPT40HGLV" type="text/javascript"></script>
    <script type="text/javascript">
      window.dataLayer = window.dataLayer || []
      function gtag(){ dataLayer.push(arguments) }
      gtag('js', new Date())
      gtag('config', 'G-DBPT40HGLV')
    </script>
    <!-- The page's typeface (index.css --font-ui), one family; text shows in
         the system's sans until it loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"/>
    <link rel="stylesheet" href="index.css" type="text/css"/>
    <!-- The loading text, styled here so it's right from the first paint,
         before the app's own CSS or code: it fades in after a moment (a
         fast load never flashes it) and out when the scene is in
         (js/loading.js). -->
    <style>
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        pointer-events: none;
        z-index: 5;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        transition: opacity 500ms ease-in-out;
      }
      #loading.done {
        opacity: 0;
      }
      /* A link with the HUD off ('v' in its s=) asks for a bare scene: no
         loading text either (the quiet-load script, below). */
      html.quiet-load #loading {
        display: none;
      }
      #loading .loading-in {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.9rem;
        opacity: 0;
        animation: loading-in 700ms ease-out 300ms forwards;
      }
      #loading .loading-title {
        /* Letter-spaced, light: the trailing spacing is taken back so it
           centres. */
        margin-right: -0.42em;
        font-size: 1.35rem;
        font-weight: 300;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #d8deec;
      }
      /* Under the title, the Moon going through its phases (the
         loading-moon script, below), in grey: asked for as text (U+FE0E),
         and where the platform draws them as colour emoji anyway, those
         greyed, so it sits with the title rather than shouting yellow. */
      #loading .loading-text {
        font-size: 1.15rem;
        line-height: 1;
        color: #b4bdd0;
        filter: grayscale(1) brightness(1.1);
      }
      /* At the bare URL the title moves to the homepage's and becomes it
         (js/loading.js handOffLoadingTitle), as the Moon fades. */
      #loading.handoff .loading-text {
        opacity: 0;
        animation: none;
        transition: opacity 400ms ease-in-out;
      }
      /* In the Moon's place when the app can't load (the stale-build
         script, below). */
      #loading .loading-failed {
        max-width: 22rem;
        font-size: 0.95rem;
        line-height: 1.4;
        text-align: center;
        color: #b4bdd0;
      }
      @keyframes loading-in {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .loading-in { animation: none; opacity: 1; }
      }
    </style>
    <link rel="icon" type="image/png" href="favicon.ico"/>
    <!-- For Slop New York (?nyc=1, CESIUM.md "New York"), a separate app
         celestiary loads at run time: its modules import three.js's dev
         build by these bare names.  Celestiary's own bundle has its three
         built in and imports nothing by name, so the map is inert until the
         city loads; nothing is fetched for it before.  Pinned to a three.js
         commit, not @dev (js/scene/cesium/newYork.test.js checks it). -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@8d737d9ceb701eedff7bba3086cefcbfb7fea9c5/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@8d737d9ceb701eedff7bba3086cefcbfb7fea9c5/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@8d737d9ceb701eedff7bba3086cefcbfb7fea9c5/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@8d737d9ceb701eedff7bba3086cefcbfb7fea9c5/examples/jsm/"
        }
      }
    </script>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          var finalPath = l.pathname.slice(0, -1) + decoded + l.hash
          window.history.replaceState(null, null, finalPath)
        }
      }(window.location))
    </script>
    <!-- quiet-load: a link that turns the HUD off ('v' in s=) loads without
         the loading text: the user has turned everything off, so the page
         stays black until the scene fades in.  It reads the fragment as
         permalink.js does (a view link: t=, cq= and fov=; js/permalink.md),
         here before the body's first paint.  Tested in js/quietLoad.test.js. -->
    <script type="text/javascript" id="quiet-load">
      (function (hash, root) {
        var at = hash.indexOf('@')
        if (at === -1) {
          return
        }
        var params = {}
        hash.slice(at + 1).split(';').slice(1).forEach(function (pair) {
          var eq = pair.indexOf('=')
          var colon = pair.indexOf(':')
          if (eq === -1 || (colon !== -1 && colon < eq)) {
            return
          }
          params[pair.slice(0, eq)] = pair.slice(eq + 1)
        })
        if (!params.t || !params.cq || !params.fov) {
          return
        }
        if ((params.s || '').indexOf('v') !== -1) {
          root.classList.add('quiet-load')
        }
      }(decodeURIComponent(window.location.hash.slice(1)), document.documentElement))
    </script>
    <!-- stale-build: index.html and index.js keep their names, every chunk
         they load is content-hashed, a deploy deletes the last build's
         chunks, and GitHub Pages lets a browser keep any file for 10
         minutes.  A cached index.js can then ask for a chunk that's gone:
         the entry's error event (a static import), a route's lazy import
         (js/Routed.jsx hands its failures to reloadStaleBuild) or an
         unhandled dynamic import says so, and the page would sit on the
         loading text for ever.  This fetches the page and index.js afresh
         (cache: 'reload' replaces the cached copies, which a reload alone
         keeps) and reloads, at most once in 30 s; a second failure in that
         time shows a message instead, so a file that's really missing
         never loops.  Only while the loading text is up: a running app
         degrades on its own (the ephemeris, Cesium).  DESIGN.md "Hosting
         and the domain"; tested in js/staleBuild.test.js. -->
    <script type="text/javascript" id="stale-build">
      (function (win, doc) {
        var KEY = 'celestiary-stale-reload'
        var GUARD_MS = 30000
        // Chromium, Safari and Firefox's words for a module that didn't load.
        var MODULE_FAILED = /Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module/
        var handled = false

        function showFailed(el) {
          var inner = el.querySelector('.loading-in')
          var moon = el.querySelector('.loading-text')
          var msg = doc.createElement('div')
          msg.className = 'loading-failed'
          msg.textContent = 'Couldn’t load the app. Reload the page to try again.'
          if (moon) {
            // The loading-moon timer stops once its element is gone.
            inner.removeChild(moon)
          }
          inner.appendChild(msg)
          doc.documentElement.classList.remove('quiet-load')
        }

        function recover() {
          var el = doc.getElementById('loading')
          if (handled || !el || el.classList.contains('done')) {
            return handled
          }
          handled = true
          var now = Date.now()
          var last
          try {
            last = Number(win.sessionStorage.getItem(KEY)) || 0
            win.sessionStorage.setItem(KEY, String(now))
          } catch (e) {
            // Nowhere to record it, so no guard: don't reload.
            last = now
          }
          if (last <= now && now - last < GUARD_MS) {
            showFailed(el)
            return true
          }
          var fresh = {cache: 'reload'}
          Promise.all([
            win.fetch(win.location.href.split('#')[0], fresh),
            win.fetch(new URL('index.js', doc.baseURI).href, fresh),
          ]).then(function () {
            win.location.reload()
          }, function () {
            showFailed(el)
          })
          return true
        }

        // Whether err is a module that didn't load, which the page now
        // handles (it's reloading, or says it can't load).
        win.reloadStaleBuild = function (err) {
          return MODULE_FAILED.test(String((err && err.message) || err)) && recover()
        }
        win.addEventListener('error', function (event) {
          var target = event.target
          if (target && target.tagName === 'SCRIPT') {
            if (target.type === 'module') {
              recover()
            }
          } else {
            win.reloadStaleBuild(event.error || event.message)
          }
        }, true)
        win.addEventListener('unhandledrejection', function (event) {
          if (win.reloadStaleBuild(event.reason)) {
            event.preventDefault()
          }
        })
      }(window, document))
    </script>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite">
      <div class="loading-in">
        <div class="loading-title">Celestiary</div>
        <div class="loading-text" role="img" aria-label="Loading">&#x1F313;&#xFE0E;</div>
      </div>
    </div>
    <!-- loading-moon: the Moon's phases round, 120 ms each, a turn a second;
         one phase held for reduced motion; nothing for a quiet load, which
         shows no loading text.  It stops once the loading text is gone. -->
    <script type="text/javascript" id="loading-moon">
      (function (doc, win) {
        var el = doc.querySelector('#loading .loading-text')
        if (!el || doc.documentElement.classList.contains('quiet-load') ||
            (win.matchMedia && win.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
          return
        }
        var phases = ['\uD83C\uDF11', '\uD83C\uDF12', '\uD83C\uDF13', '\uD83C\uDF14',
          '\uD83C\uDF15', '\uD83C\uDF16', '\uD83C\uDF17', '\uD83C\uDF18']
        var i = 0
        var timer = win.setInterval(function () {
          if (!el.isConnected) {
            win.clearInterval(timer)
            return
          }
          i = (i + 1) % phases.length
          el.textContent = phases[i] + '\uFE0E'
        }, 120)
      }(document, window))
    </script>
    <div id="root"></div>
    <script type="text/javascript">
      // The page is up: dim it from the user's theme to the scene's black,
      // a frame after the first paint, so the transition has a start.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          document.documentElement.classList.add('page-up')
        })
      })
    </script>
    <script type="module" src="index.js"></script>
  </body>
</html>
