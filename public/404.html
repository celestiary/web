<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Celestiary - Redirect</title>
  <!-- The page this sends the browser to mustn't see this one as its
       referrer: on the same origin the app routes to the referrer's path
       (js/Routed.jsx), which would turn /web/#<scene> into /web/ and drop
       the scene. -->
  <meta name="referrer" content="no-referrer">
  {{SITE_HEAD}}
  <!-- Start Single Page Apps for GitHub Pages -->
  <script type="text/javascript" id="bounce">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // This page needs to be > 512 bytes to work for IE.
    //
    // GitHub Pages serves a site's top-level 404.html for every missing path
    // under it.  Filled in at build time (esbuild/site.js fillPlaceholders):
    // the base path's segment count, and, for the redirect stub left at
    // /web/ (esbuild/webStub.js), where the site moved to.  Tested in
    // esbuild/notFound.test.js.
    var pathSegmentsToKeep = {{PATH_SEGMENTS_TO_KEEP}}
    var movedTo = '{{MOVED_TO}}'

    var l = window.location
    var origin = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '')
    var segments = l.pathname.split('/')
    // A PR preview's deep links (/web/pr-preview/pr-N/guide/star) reach the
    // 404.html at the top of the site the previews live in.  Keep the
    // preview's two segments too, so the bounce lands on the preview's own
    // index.html, which restores the path.
    var isPreview = segments[1 + pathSegmentsToKeep] === 'pr-preview' &&
        /^pr-\d+$/.test(segments[2 + pathSegmentsToKeep] || '')
    if (isPreview) {
      pathSegmentsToKeep += 2
    }
    if (movedTo && !isPreview) {
      // The site moved (celestiary.org/web/ to the root): the same path
      // there, with the query and the #fragment (a scene link), which only
      // the browser has, so no server redirect could keep it.
      l.replace(origin + movedTo + segments.slice(1 + pathSegmentsToKeep).join('/') + l.search + l.hash)
    } else if (l.search.slice(0, 2) === '?/') {
      // Bounced once already, and the base itself is missing (a removed
      // preview): stop, or each bounce would 404 into another.
      document.title = 'Celestiary - Not found'
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('not-found').hidden = false
      })
    } else {
      l.replace(
        origin +
        segments.slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    }
  </script>
  <!-- End Single Page Apps for GitHub Pages -->
</head>
<body>
  <p id="not-found" hidden>Nothing here.  <a href="/">Celestiary</a></p>
</body>
</html>
