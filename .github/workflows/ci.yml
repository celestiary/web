name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      # The tests and the bundle check read bundled data, which may be in LFS.
      - uses: ./.github/actions/lfs

      - uses: actions/setup-node@v6.4.0
        with:
          # Cesium requires Node >= 22, and yarn enforces engines.
          node-version: '22'
          cache: yarn

      - uses: oven-sh/setup-bun@v2.2.0

      - run: yarn install --frozen-lockfile

      - run: yarn precommit
