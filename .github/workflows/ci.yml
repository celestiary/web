name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What `yarn precommit` runs, as jobs side by side: lint with the bundle
  # check, and the tests in shards.  Locally `yarn precommit` runs the three at
  # once on one machine (tools/test/precommit.mjs).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      # The bundle check reads bundled data, which may be in LFS.
      - uses: ./.github/actions/lfs

      - uses: actions/setup-node@v6.4.0
        with:
          # Cesium requires Node >= 22, and yarn enforces engines.
          node-version: '22'
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn bundle-check

  # The bun tests, split into balanced shards: tools/test/run.mjs divides the
  # files by their times in tools/test/timings.json, and each shard runs its
  # share in parallel on the runner's cores.  The shard count is the "/2" here
  # and in `--shard`; the split follows it.  Not fail-fast: every shard's
  # verdict shows.
  test:
    name: test (${{ matrix.shard }}/1)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@v6.0.2

      # The tests read bundled data, which may be in LFS.
      - uses: ./.github/actions/lfs

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: yarn

      - uses: oven-sh/setup-bun@v2.2.0

      - run: yarn install --frozen-lockfile

      - run: echo "$(nproc) cores"

      - run: yarn test --shard=${{ matrix.shard }}/1

  # The one name to require: a pull request's `precommit` check passes when
  # lint and every test shard do.  (It was the single job that ran all three,
  # and branch protection may still ask for it by that name.)
  precommit:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "test: ${{ needs.test.result }}"
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.test.result }}" = success ]

  # The homepage's load against its budget (esbuild/budget.js,
  # tools/loadBudget/): a build served with gzip, loaded in headless Chromium,
  # requests and bytes from the DevTools protocol.  A job of its own, so it
  # runs beside `precommit` rather than after it; it is not in `yarn
  # precommit`, which stays cheap.  (The static half, the first load's size,
  # is in precommit: `yarn bundle-check`.)
  load-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      # LFS, Node, yarn install and `yarn build` (no ion token: the homepage
      # doesn't load Cesium).
      - uses: ./.github/actions/build

      # Only the headless shell, the browser Playwright launches headless;
      # its download is cached by Playwright's version.  The system libraries
      # it needs are not cached, so install them every time.
      - id: playwright
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}

      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium-headless-shell

      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium-headless-shell

      - run: yarn load-budget
