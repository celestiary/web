name: PR preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          # The PR merged into its base is HEAD (a merge commit), so HEAD^1
          # is the base, to see what the PR changes.
          fetch-depth: 2

      # Large data (.github/large-data-paths) is not copied into every
      # preview: the app loads it from production, unless this PR changes
      # it, when the preview needs its own full copy. Unsure means copy.
      - name: Does this PR change large data?
        id: data
        run: |
          copy=true
          if git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            copy="$(.github/scripts/large-data.sh changed HEAD^1 HEAD)"
          fi
          echo "copy=${copy}" >> "$GITHUB_OUTPUT"
          echo "Full copy of large data in the preview: ${copy}"

      - uses: ./.github/actions/build
        with:
          base-path: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
          cesium-ion-token: ${{ secrets.CESIUM_ION_TOKEN }}
          # Production: main, deployed to celestiary.org's root
          # (deploy-prod.yml), the same origin as the previews.
          data-base-url: ${{ steps.data.outputs.copy != 'true' && 'https://celestiary.org/' || '' }}
          # A preview is a copy: keep it out of search results.
          noindex: 'true'
          # ?cesium=iframe loads this PR's guest page (cesium-guest.yml
          # deploys it there), not main's.
          cesium-guest-page: https://pablo-mayrgundter.github.io/cesium-portal/pr-preview/pr-${{ github.event.number }}/cesium-guest.html
          # The large data is dropped below, so its LFS files aren't needed.
          lfs: ${{ steps.data.outputs.copy }}

      - name: Leave large data out of the preview
        if: steps.data.outputs.copy != 'true'
        run: .github/scripts/large-data.sh strip docs

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: docs
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          # This repo's Pages site is celestiary.org/web/, for the comment's
          # link (the action's guess is the github.io address, which only
          # redirects).
          pages-base-url: celestiary.org/${{ github.event.repository.name }}
          action: deploy

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Remove preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
