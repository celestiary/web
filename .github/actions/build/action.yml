name: Build Celestiary
description: Install dependencies and produce the ./docs/ static site.
inputs:
  base-path:
    description: >
      URL path prefix the site will be served under. Must start and end with /.
      Use / for the celestiary.github.io user-page root, /web/ for this repo's
      project page, and /web/pr-preview/pr-NNN/ for PR previews.
    required: false
    default: /
  cesium-ion-token:
    description: >
      Cesium ion access token for the Cesium layers (CESIUM.md). Optional;
      without it Earth's Cesium layer uses Cesium's bundled offline imagery.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6.4.0
      with:
        # Cesium requires Node >= 22, and yarn enforces engines.
        node-version: '22'
        cache: yarn

    - shell: bash
      run: yarn install --frozen-lockfile

    - shell: bash
      env:
        BASE_PATH: ${{ inputs.base-path }}
        CESIUM_ION_TOKEN: ${{ inputs.cesium-ion-token }}
      run: yarn build
