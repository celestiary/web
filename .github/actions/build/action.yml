name: Build Celestiary
description: Install dependencies and produce the ./docs/ static site.
inputs:
  base-path:
    description: >
      URL path prefix the site will be served under. Must start and end with /.
      Use / for celestiary.org's root (production) and /web/pr-preview/pr-NNN/
      for PR previews, which this repo's Pages site serves under /web/.
    required: false
    default: /
  cesium-ion-token:
    description: >
      Cesium ion access token for the Cesium layers (CESIUM.md). Optional;
      without it Earth's Cesium layer uses Cesium's bundled offline imagery.
    required: false
    default: ''
  data-base-url:
    description: >
      Where the app fetches large data (textures, stars.dat, public/large/)
      from: a URL, e.g. https://celestiary.org/. Empty means the
      site's own origin and path. PR previews set the production URL rather
      than copy the data (DESIGN.md, "Data policy").
    required: false
    default: ''
  custom-domain:
    description: >
      The domain this build is served at the root of, e.g. celestiary.org.
      Writes CNAME (which GitHub Pages reads; a deploy that replaces the
      branch would otherwise drop the domain), robots.txt and sitemap.xml.
      Only the build for the domain's root sets it.
    required: false
    default: ''
  cesium-guest-page:
    description: >
      The Cesium guest page `?cesium=iframe` loads by default
      (js/cesium-guest/origins.js; design/CesiumGuest.md). Empty means
      main's; a PR preview sets its guest's preview, so the two match.
    required: false
    default: ''
  noindex:
    description: >
      'true' for a copy that search engines shouldn't index (PR previews).
    required: false
    default: 'false'
  lfs:
    description: >
      Whether to fetch the Git LFS files first. Set false only when the large
      data is dropped from the output afterwards (a preview that loads it from
      production), since the pointer files would be useless.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - if: inputs.lfs == 'true'
      uses: ./.github/actions/lfs

    - uses: actions/setup-node@v6.4.0
      with:
        # Cesium requires Node >= 22, and yarn enforces engines.
        node-version: '22'
        cache: yarn

    - shell: bash
      run: yarn install --frozen-lockfile

    - shell: bash
      env:
        BASE_PATH: ${{ inputs.base-path }}
        CESIUM_ION_TOKEN: ${{ inputs.cesium-ion-token }}
        DATA_BASE_URL: ${{ inputs.data-base-url }}
        CUSTOM_DOMAIN: ${{ inputs.custom-domain }}
        CESIUM_GUEST_PAGE: ${{ inputs.cesium-guest-page }}
        NOINDEX: ${{ inputs.noindex }}
      run: yarn build
