<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Celestiary - Redirect</title>
  <!-- Start Single Page Apps for GitHub Pages -->
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // This page needs to be > 512 bytes to work for IE.  Currently 968.
    // Injected at build time from $BASE_PATH; see esbuild/build.js.
    var pathSegmentsToKeep = 1

    var l = window.location
    // GitHub Pages serves this one file (production's) for every 404 on the
    // site, including a PR preview's deep links (/web/pr-preview/pr-N/guide/
    // star).  Keep the preview's two segments too, or the bounce lands on
    // production's index.html, which runs production's app at the preview's
    // URL.  The preview's own index.html then restores the path.
    if (l.pathname.split('/')[1 + pathSegmentsToKeep] === 'pr-preview' &&
        /^pr-\d+$/.test(l.pathname.split('/')[2 + pathSegmentsToKeep] || '')) {
      pathSegmentsToKeep += 2
    }
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    )
  </script>
  <!-- End Single Page Apps for GitHub Pages -->
</head>
<body></body>
</html>
